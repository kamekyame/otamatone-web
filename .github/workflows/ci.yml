name: CI

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10
        with:
          version: '2026.11.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm test
